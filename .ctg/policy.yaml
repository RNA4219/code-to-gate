version: ctg/v1

policy_id: code-to-gate-quality-policy
# Quality policy for the code-to-gate repository

blocking:
  severity:
    critical: true
    high: true
    medium: false
    low: false
  category:
    auth: true
    payment: true
    validation: true
    security: true
    data: false
    config: false
    maintainability: false
    testing: false
    compatibility: false
  rules:
    # Block on critical security rules
    HARDCODED_SECRET: true
    RAW_SQL: true
    UNSAFE_REDIRECT: true
  count_threshold:
    critical_max: 0
    high_max: 10
    medium_max: 50
    low_max: 100

llm:
  require_llm: false

suppression:
  file: .ctg/suppressions.yaml
  expiry_warning_days: 30
  max_suppressions_per_rule: 10

confidence:
  min_confidence: 0.6
  low_confidence_threshold: 0.4
  filter_low: true

partial:
  allow_partial: false
  partial_warning_threshold: 0.2

exit:
  fail_on_critical: true
  fail_on_high: true
  warn_only: false

# Coverage threshold 80 is managed by CI configuration.
