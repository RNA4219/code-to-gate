version: ctg/v1
policy_id: ci-release-readiness

# diff は差分取得前に未対応項目を拒否するため、readiness用policyと分離する。
# 最終readinessでは既存policyを使い、抑制・LLMを含む全設定を適用する。
blocking:
  severity:
    critical: true
    high: true
    medium: false
    low: false
  category:
    auth: true
    payment: true
    validation: true
    data: false
    config: false
    maintainability: false
    testing: false

confidence:
  min_confidence: 0.6
  low_confidence_threshold: 0.4
  filter_low: true

partial:
  allow_partial: false
  partial_warning_threshold: 0.2
